AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Web layer for the Financial Research Workbench: a static web app on S3 behind CloudFront, Amazon Cognito
  sign-in, and an HTTP API (JWT authorizer) in front of the query Lambda. The site and the API share one
  CloudFront address, so no cross-origin setup is needed.

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]{2,18}$"
  QueryRoleArn:
    Type: String
  DataBucketName:
    Type: String
  CollectionEndpoint:
    Type: String
  ClaudeInferenceProfileId:
    Type: String
  EmbeddingDimension:
    Type: Number
    Default: 1024
  IndexName:
    Type: String
    Default: pages
    Description: OpenSearch index the query Lambda searches.
  RerankEndpointName:
    Type: String
    Default: ""
    Description: Optional name of a rerank endpoint you provide. Empty means ProjectName-rerank.
  RerankChars:
    Type: Number
    Default: 8000
    Description: Characters of each page's text sent to Rerank. Shorter windows cut the end of long pages and lowered accuracy in testing.
  AdminEmail:
    Type: String
    Default: ""
    Description: Optional. Creates the first user and emails a temporary password. Leave empty to create users yourself.
  AppTitle:
    Type: String
    Default: Research and Diligence Workbench
    MaxLength: 80
  SiteVersion:
    Type: String
    Default: "1"
    Description: Change this value to republish the web app files after editing them (the deploy script sets it from the file contents).

Conditions:
  HasAdminEmail: !Not [!Equals [!Ref AdminEmail, ""]]
  HasCustomRerank: !Not [!Equals [!Ref RerankEndpointName, ""]]

Resources:
  # ---------------------------------------------------------------- sign-in
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${ProjectName}-web"
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

  AdminUser:
    Type: AWS::Cognito::UserPoolUser
    Condition: HasAdminEmail
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref AdminEmail
      DesiredDeliveryMediums: [EMAIL]
      UserAttributes:
        - Name: email
          Value: !Ref AdminEmail
        - Name: email_verified
          Value: "true"

  # ---------------------------------------------------------------- query Lambda and HTTP API
  QueryFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-query"
      RetentionInDays: 14

  QueryFunction:
    Type: AWS::Lambda::Function
    DependsOn: QueryFunctionLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-query"
      Runtime: python3.12
      Handler: handler.handler
      Role: !Ref QueryRoleArn
      Timeout: 29 # HTTP API integrations time out at 30 seconds
      MemorySize: 512
      Code: ../../src/lambdas/query
      Environment:
        Variables:
          COLLECTION_ENDPOINT: !Ref CollectionEndpoint
          INDEX_NAME: !Ref IndexName
          QUERY_EMBED_ENDPOINT: !Sub "${ProjectName}-embed-pro"
          RERANK_ENDPOINT: !If [HasCustomRerank, !Ref RerankEndpointName, !Sub "${ProjectName}-rerank"]
          DATA_BUCKET: !Ref DataBucketName
          CLAUDE_MODEL_ID: !Ref ClaudeInferenceProfileId
          EMBEDDING_DIMENSION: !Ref EmbeddingDimension
          RERANK_CHARS: !Ref RerankChars

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-api"
      ProtocolType: HTTP

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      # Demo guardrail: caps request rate so a loop or a leaked login cannot run up Bedrock and GPU costs.
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: ["$request.header.Authorization"]
      JwtConfiguration:
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
        Audience: [!Ref UserPoolClient]

  QueryIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt QueryFunction.Arn
      PayloadFormatVersion: "2.0"

  QueryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/query
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${QueryIntegration}"

  PageImageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/page-image
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${QueryIntegration}"

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref QueryFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

  # ---------------------------------------------------------------- static site
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-site-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${ProjectName}-security-headers"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://*.s3.${AWS::Region}.amazonaws.com;
              connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com; base-uri 'none'; form-action 'self'; frame-ancestors 'none'
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} web app"
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeaders

  SiteDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-site-deploy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: site-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: !Sub "${SiteBucket.Arn}/*"

  SiteDeployFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-site-deploy"
      Runtime: python3.12
      Handler: site_deploy.handler
      Role: !GetAtt SiteDeployRole.Arn
      Timeout: 120
      MemorySize: 256
      Code: ../../src/ui

  SiteContent:
    Type: Custom::SiteContent
    DependsOn: SiteBucketPolicy
    Properties:
      ServiceToken: !GetAtt SiteDeployFunction.Arn
      BucketName: !Ref SiteBucket
      Region: !Ref AWS::Region
      UserPoolClientId: !Ref UserPoolClient
      AppTitle: !Ref AppTitle
      SiteVersion: !Ref SiteVersion

Outputs:
  SiteUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ApiId:
    Value: !Ref HttpApi
