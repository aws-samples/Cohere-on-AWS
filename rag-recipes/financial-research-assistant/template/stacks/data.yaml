AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Data layer for the Financial Research Workbench: encrypted S3 bucket, ingestion state
  table, and an OpenSearch Serverless NextGen vector collection (scales to zero) with the
  page index created by a custom resource.

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]{2,18}$"
  DataKeyArn:
    Type: String
  DataSetupRoleArn:
    Type: String
  IngestRoleArn:
    Type: String
  QueryRoleArn:
    Type: String
  ExtraAossPrincipalArn:
    Type: String
    Default: ""
    Description: Optional extra IAM role ARN granted data access to the collection (development only).
  MaxSearchOcu:
    Type: Number
    Default: 4
    AllowedValues: [2, 4, 8, 16]
  MaxIndexingOcu:
    Type: Number
    Default: 4
    AllowedValues: [2, 4, 8, 16]
  EmbeddingDimension:
    Type: Number
    Default: 1024
  CreateIndex:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Development switch. Set to false to create the collection without the page index.

Conditions:
  ShouldCreateIndex: !Equals [!Ref CreateIndex, "true"]
  HasExtraPrincipal: !Not [!Equals [!Ref ExtraAossPrincipalArn, ""]]

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-data-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: "aws:kms"
              KMSMasterKeyID: !Ref DataKeyArn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  IngestStateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "${ProjectName}-ingest-state"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: page_id
          AttributeType: S
      KeySchema:
        - AttributeName: page_id
          KeyType: HASH

  # ---- OpenSearch Serverless (NextGen collection group, scale to zero) ----
  CollectionGroup:
    Type: AWS::OpenSearchServerless::CollectionGroup
    Metadata:
      # cfn-lint's bundled schema predates NextGen: it does not know "Generation" and
      # wrongly requires a minimum capacity of 1. The AWS CloudFormation reference allows both.
      cfn-lint:
        config:
          ignore_checks: [E3002, E3034]
    Properties:
      Name: !Sub "${ProjectName}-group"
      Generation: NEXTGEN
      StandbyReplicas: ENABLED # the service rejects DISABLED for NEXTGEN groups
      CapacityLimits:
        MinIndexingCapacityInOcu: 0
        MinSearchCapacityInOcu: 0
        MaxIndexingCapacityInOcu: !Ref MaxIndexingOcu
        MaxSearchCapacityInOcu: !Ref MaxSearchOcu

  EncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${ProjectName}-enc"
      Type: encryption
      Policy: !Sub |
        {"Rules":[{"ResourceType":"collection","Resource":["collection/${ProjectName}-vectors"]}],"AWSOwnedKey":true}

  NetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${ProjectName}-net"
      Type: network
      Policy: !Sub |
        [{"Rules":[{"ResourceType":"collection","Resource":["collection/${ProjectName}-vectors"]}],"AllowFromPublic":true}]

  DataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub "${ProjectName}-access"
      Type: data
      Policy: !Sub
        - |
          [{"Rules":[{"ResourceType":"collection","Resource":["collection/${ProjectName}-vectors"],"Permission":["aoss:DescribeCollectionItems","aoss:CreateCollectionItems","aoss:UpdateCollectionItems"]},{"ResourceType":"index","Resource":["index/${ProjectName}-vectors/*"],"Permission":["aoss:*"]}],"Principal":["${DataSetupRoleArn}","${IngestRoleArn}","${QueryRoleArn}"${Extra}]}]
        - Extra: !If [HasExtraPrincipal, !Sub ',"${ExtraAossPrincipalArn}"', ""]

  Collection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn:
      - EncryptionPolicy
      - NetworkPolicy
      - DataAccessPolicy
      - CollectionGroup
    Properties:
      Name: !Sub "${ProjectName}-vectors"
      Type: VECTORSEARCH
      CollectionGroupName: !Sub "${ProjectName}-group"

  # ---- Custom resources: page index + empty-bucket-on-delete ----
  DataSetupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-data-setup"
      Runtime: python3.12
      Handler: handler.handler
      Role: !Ref DataSetupRoleArn
      Timeout: 900
      MemorySize: 256
      Code: ../../src/lambdas/data_setup

  PageIndex:
    Type: Custom::OpenSearchIndex
    Condition: ShouldCreateIndex
    DependsOn: Collection
    Properties:
      ServiceToken: !GetAtt DataSetupFunction.Arn
      Action: CreateIndex
      CollectionName: !Sub "${ProjectName}-vectors"
      IndexName: pages
      Dimension: !Ref EmbeddingDimension

  BucketEmptier:
    Type: Custom::EmptyBucket
    DependsOn: DataBucketPolicy
    Properties:
      ServiceToken: !GetAtt DataSetupFunction.Arn
      Action: EmptyBucketOnDelete
      BucketName: !Ref DataBucket

Outputs:
  DataBucketName:
    Value: !Ref DataBucket
  DataBucketArn:
    Value: !GetAtt DataBucket.Arn
  IngestStateTableName:
    Value: !Ref IngestStateTable
  CollectionName:
    Value: !Sub "${ProjectName}-vectors"
  CollectionEndpoint:
    Value: !GetAtt Collection.CollectionEndpoint
  IndexName:
    Value: pages
